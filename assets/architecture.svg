<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
<defs>
  <style>
    .box{fill:#f7f7f7;stroke:#222;stroke-width:2;rx:14}
    .title{font:700 20px Arial;fill:#111}
    .txt{font:15px Arial;fill:#333}
    .arrow{stroke:#444;stroke-width:2.5;fill:none;marker-end:url(#a)}
  </style>
  <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
    <path d="M0,0 L10,3 L0,6 z" fill="#444"/>
  </marker>
</defs>
<rect width="1200" height="560" fill="white"/>
<text x="600" y="42" text-anchor="middle" class="title">Limit Order Book &amp; Matching Engine — System Architecture</text>

<rect x="70" y="110" width="220" height="110" class="box"/>
<text x="180" y="145" text-anchor="middle" class="title">Order Entry</text>
<text x="180" y="175" text-anchor="middle" class="txt">TCP client / FIX-style</text>
<text x="180" y="198" text-anchor="middle" class="txt">NEW / CANCEL</text>

<rect x="385" y="90" width="330" height="150" class="box"/>
<text x="550" y="125" text-anchor="middle" class="title">Matching Engine</text>
<text x="550" y="155" text-anchor="middle" class="txt">Price-time priority</text>
<text x="550" y="180" text-anchor="middle" class="txt">Limit + market orders</text>
<text x="550" y="205" text-anchor="middle" class="txt">Cancel / amend / match</text>

<rect x="810" y="110" width="300" height="110" class="box"/>
<text x="960" y="145" text-anchor="middle" class="title">Market Data Feed</text>
<text x="960" y="175" text-anchor="middle" class="txt">UDP multicast publisher</text>
<text x="960" y="198" text-anchor="middle" class="txt">Trades + book updates</text>

<rect x="385" y="330" width="330" height="110" class="box"/>
<text x="550" y="365" text-anchor="middle" class="title">Python Integration</text>
<text x="550" y="395" text-anchor="middle" class="txt">pybind11 + OrderBook API</text>
<text x="550" y="418" text-anchor="middle" class="txt">Simulation / analysis tooling</text>

<rect x="810" y="330" width="300" height="110" class="box"/>
<text x="960" y="365" text-anchor="middle" class="title">Real-time Visualization</text>
<text x="960" y="395" text-anchor="middle" class="txt">Price / depth / volume</text>
<text x="960" y="418" text-anchor="middle" class="txt">Buy &amp; sell pressure</text>

<path d="M290 165 L385 165" class="arrow"/>
<path d="M715 165 L810 165" class="arrow"/>
<path d="M550 240 L550 330" class="arrow"/>
<path d="M715 385 L810 385" class="arrow"/>
<path d="M960 220 L960 330" class="arrow"/>
</svg>